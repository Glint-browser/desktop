name: Release

# Build the macOS (universal) and Windows installers and publish them to a
# GitHub Release. electron-updater in the app reads that release's metadata
# (latest.yml / latest-mac.yml) to offer in-app updates.
#
# Trigger by pushing a version tag, e.g.:
#   npm version patch && git push --follow-tags
# or run manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: publish:mac
          - os: windows-latest
            script: publish:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          # electron-builder uploads artifacts to the GitHub Release using this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple signing certs configured — don't try to auto-sign on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false
